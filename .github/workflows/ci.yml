name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: [self-hosted, linux, arm64, hikae-flash]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        timeout-minutes: 5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify dependencies
        run: go mod verify
        timeout-minutes: 5

      - name: Vet
        run: go vet ./...
        timeout-minutes: 10

      - name: Build
        run: go build ./...
        timeout-minutes: 10

      - name: Test
        run: go test -v -race ./...
        timeout-minutes: 15
